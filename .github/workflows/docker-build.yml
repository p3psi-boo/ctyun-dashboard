name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 质量闸门：语法检查 + 结构性回归测试。任一失败即终止，绝不构建/推送坏镜像。
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 移动公众协议侧车的运行时依赖：回归测试里有一批**真实拉起侧车**的断言，
      # 缺了这些包（曾经的 ModuleNotFoundError: No module named 'Crypto'）会让侧车级
      # 断言退化成"只验证未就绪"，闸门形同虚设 —— 与 Dockerfile 保持一致装齐。
      - name: Set up Python (sidecar runtime)
        uses: actions/setup-python@v5
        with:
          # 与 Docker 基础镜像 node:22-bookworm-slim 自带的 python3（3.11）对齐，避免 CI 绿、镜像红。
          python-version: '3.11'

      - name: Install sidecar dependencies
        run: pip install --require-hashes -r app/ecloud_engine/requirements.txt

      - name: Syntax check (node --check)
        run: node tests/syntax_check.js

      - name: Regression invariants
        run: node tests/regression.test.js

      - name: Set up QEMU (for multi-arch)
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 1. 登录 GitHub Packages (GHCR) —— PR 只做本地冒烟，不推送
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 2. 登录 Docker Hub (明确绑定账号 learycn，支持 LEARYCN / DOCKERHUB_TOKEN 等 Secret)
      - name: Log in to Docker Hub
        id: dockerhub-login
        continue-on-error: true
        env:
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME || 'learycn' }}
          DOCKER_PASS: ${{ secrets.LEARYCN || secrets.DOCKERHUB_TOKEN || secrets.DOCKER_PASSWORD }}
        if: github.event_name != 'pull_request' && env.DOCKER_PASS != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USER }}
          password: ${{ env.DOCKER_PASS }}

      # 3. 动态配置镜像目标列表 (推送至 learycn/ctyun-dashboard 与 ghcr.io/muyicn/ctyun-dashboard)
      - name: Determine Docker images
        id: image-targets
        run: |
          IMAGES="ghcr.io/${{ github.repository }}"
          if [ "${{ steps.dockerhub-login.outcome }}" = "success" ]; then
            IMAGES="${IMAGES}
          learycn/ctyun-dashboard"
          fi
          echo "images<<EOF" >> $GITHUB_OUTPUT
          echo "$IMAGES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # 4. 提取镜像元数据与多架构标签
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image-targets.outputs.images }}
          tags: |
            type=raw,value=latest
            type=ref,event=branch
            type=semver,pattern={{version}}

      # 5a. PR：单架构 load + /healthz 冒烟，拦住 Dockerfile / 入口脚本回归
      - name: Build image for PR smoke
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ctyun-dashboard:pr-smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke /healthz
        if: github.event_name == 'pull_request'
        run: |
          docker run -d --name ctyun-smoke -p 8571:8571 -e CTYUN_DATA_DIR=/app/data ctyun-dashboard:pr-smoke
          trap 'docker logs ctyun-smoke || true; docker rm -f ctyun-smoke || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8571/healthz | grep -q '"ok":true'; then
              echo "healthz ok"
              docker stop ctyun-smoke
              trap - EXIT
              docker rm -f ctyun-smoke || true
              exit 0
            fi
            sleep 1
          done
          echo "healthz did not become ready"
          exit 1

      # 5b. main / tag / 手动：构建多架构镜像并推送
      - name: Build and push Docker image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
